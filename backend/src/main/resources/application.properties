spring.application.name=healthcare-scheduler-api
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_scheduler?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=your-secret-key-change-this-in-production-make-it-very-long-and-secure
jwt.expiration=86400000
logging.level.com.healthcare.scheduler=DEBUG
logging.level.org.springframework.security=DEBUG
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
cors.allowed-origins=http://localhost:3000,http://localhost:19006
azure.communication.connection-string=endpoint=https://<resource-name>.communication.azure.com/;accesskey=<access-key>
azure.communication.phone-number=+1234567890
azure.communication.callback-url=https://your-domain.com/api/callbacks/voice
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html